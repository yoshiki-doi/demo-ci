# Weekly business report (headless): Claude Code reads Sysdig through MCP and writes one Markdown report.
# Called from each demo-biz-* repository, so every business runs with its own secrets
# (a Sysdig team service account key that only sees that business's zones).
name: weekly-report

on:
  workflow_call:
    inputs:
      biz:
        description: Business key (a, b or c)
        type: string
        required: true
      sysdig-url:
        type: string
        default: https://app.au1.sysdig.com   # AU1 region
      use-skills:
        description: Use the Sysdig Headless Cloud Security skills (sysdig/skills) through the hosted Sysdig MCP server
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      SYSDIG_SECURE_API_TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The caller must grant at least these permissions.
    permissions:
      contents: read
      actions: read
      security-events: read
    env:
      SYSDIG_SECURE_URL: ${{ inputs.sysdig-url }}
      SYSDIG_SECURE_API_TOKEN: ${{ secrets.SYSDIG_SECURE_API_TOKEN }}
    steps:
      # The called workflow's own repository is not checked out automatically; fetch the prompt and MCP config.
      - uses: actions/checkout@v4
        with:
          repository: yoshiki-doi/demo-ci
          ref: main
          path: .ci

      # CI and code scanning of this repository are collected here and handed to Claude as a file,
      # so Claude does not need shell access.
      - name: Collect GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_run=$(gh run list -R "$REPO" --workflow ci --limit 1 --json status,conclusion,createdAt,headSha | jq -c '.[0] // {}')
          if cs_lines=$(gh api "repos/$REPO/code-scanning/alerts?state=open&per_page=100" --paginate \
                -q '.[] | (.rule.security_severity_level // .rule.severity)' 2>/dev/null); then
            cs=$(printf '%s' "$cs_lines" | jq -R -s 'split("\n") | map(select(length>0)) | group_by(.) | map({(.[0]): length}) | add // {}')
          else
            cs='"unavailable (code scanning is not enabled for this repository)"'
          fi
          jq -n --arg repo "$REPO" --argjson run "$latest_run" --argjson cs "$cs" \
            '{repository: $repo, latest_ci_run: $run, code_scanning_open_by_severity: $cs}' > github-data.json
          cat github-data.json

      - name: Render prompt
        id: prompt
        env:
          BIZ: ${{ inputs.biz }}
          REPO: ${{ github.repository }}
          PROMPT_FILE: ${{ inputs.use-skills && 'weekly-report-skills.prompt.md' || 'weekly-report.prompt.md' }}
        run: |
          set -euo pipefail
          upper=$(printf '%s' "$BIZ" | tr '[:lower:]' '[:upper:]')
          {
            echo "prompt<<PROMPT_EOF"
            sed -e "s/{BIZ大文字}/$upper/g" -e "s/{BIZ}/$BIZ/g" -e "s#yoshiki-doi/demo-biz-$BIZ#$REPO#g" ".ci/reports/$PROMPT_FILE"
            cat <<'ADDENDUM'

          ## 実行環境の指定（GitHub Actions）

          - `gh` コマンドは使えない。CI の結果と Code scanning の件数は、ワークスペースの `github-data.json` を読む。
          - 完成したレポートは、ワークスペースの `report.md` に Write ツールで保存する（標準出力には出さない）。
          ADDENDUM
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # Fail fast with a readable reason instead of a generic "Invalid API key" from the action.
      # Prints only the length, the "sk-ant-" style prefix, whether whitespace sneaked in, and the HTTP status.
      - name: Check ANTHROPIC_API_KEY
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::ANTHROPIC_API_KEY is empty or not set"; exit 1; fi
          ws=no; case "$KEY" in *[[:space:]]*) ws=yes ;; esac
          echo "length=${#KEY} prefix=${KEY:0:7} whitespace_inside=$ws"
          code=$(curl -s -o /tmp/anthropic-check.json -w '%{http_code}' https://api.anthropic.com/v1/models \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01")
          echo "Anthropic API status: $code"
          if [ "$code" != "200" ]; then
            # The error body holds only the error type and message (no secrets).
            echo "Anthropic API error: $(jq -r '.error | "\(.type): \(.message)"' /tmp/anthropic-check.json 2>/dev/null | cut -c1-300)"
            echo "::error::ANTHROPIC_API_KEY was rejected (HTTP $code)"; exit 1
          fi
          # A valid key can still be out of credit. Send a tiny message (8 tokens) with the report model and a small
          # model, and show the status, the error text and the organization the request was billed to.
          for model in claude-sonnet-5-5 claude-haiku-4-5-20251001; do
            code=$(curl -s -D /tmp/anthropic-headers.txt -o /tmp/anthropic-msg.json -w '%{http_code}' https://api.anthropic.com/v1/messages \
              -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
              -d "{\"model\":\"$model\",\"max_tokens\":8,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
            org=$(tr -d '\r' < /tmp/anthropic-headers.txt | awk -F': ' 'tolower($1)=="anthropic-organization-id"{print $2}')
            echo "messages $model: HTTP $code, organization_id=${org:-n/a}"
            if [ "$code" != "200" ]; then
              echo "  error: $(jq -r '.error | "\(.type): \(.message)"' /tmp/anthropic-msg.json 2>/dev/null | cut -c1-300)"
              [ "$model" = "claude-sonnet-5-5" ] && failed=1
            fi
          done
          [ "${failed:-0}" = "0" ] || { echo "::error::A test message with the report model failed (see above)"; exit 1; }

      # TEMPORARY diagnosis: which kind of request is refused with "credit balance is too low"?
      - name: Diagnose request sizes (temporary)
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          call() { # label, json body
            code=$(curl -s -o /tmp/d.json -w '%{http_code}' https://api.anthropic.com/v1/messages \
              -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d "$2")
            echo "$1: HTTP $code $(jq -r 'if .error then "\(.error.type): \(.error.message)" else "input_tokens=\(.usage.input_tokens) output_tokens=\(.usage.output_tokens)" end' /tmp/d.json | cut -c1-200)"
          }
          call "A) max_tokens=32000, tiny prompt" '{"model":"claude-sonnet-5-5","max_tokens":32000,"messages":[{"role":"user","content":"Reply with one word."}]}'
          big=$(python3 -c "print('The quick brown fox jumps over the lazy dog. ' * 2200)")
          body=$(jq -nc --arg t "$big" '{model:"claude-sonnet-5-5",max_tokens:8,messages:[{role:"user",content:($t + "\nReply with one word.")}]}')
          call "B) ~22k input tokens, max_tokens=8" "$body"
          call "C) max_tokens=64000, tiny prompt" '{"model":"claude-sonnet-5-5","max_tokens":64000,"messages":[{"role":"user","content":"Reply with one word."}]}'
        continue-on-error: true

      - name: Generate report with Claude Code
        if: ${{ !inputs.use-skills }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --mcp-config .ci/sysdig-mcp.json
            --allowedTools "mcp__secure-mcp-server__list_zones,mcp__secure-mcp-server__list_runtime_scan_results,mcp__secure-mcp-server__count_runtime_events,mcp__secure-mcp-server__discover_runtime_event_field_values,Read,Write"

      # Skills mode (vulnerability report with sysdig-investigate): the hosted Sysdig MCP server accepts the team
      # service account key as a Bearer token, so no OAuth login is needed. Only a small read-only tool list is allowed.
      - name: Generate report with Claude Code (Sysdig skills)
        if: ${{ inputs.use-skills }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          plugin_marketplaces: "https://github.com/sysdig/skills.git"
          plugins: "headless-cloud-security@sysdig-skills"
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --mcp-config .ci/sysdig-mcp-hosted.json
            --allowedTools "Skill,Read,Write,Glob,mcp__secure-mcp-server__list_zones,mcp__secure-mcp-server__query_vulnerability_findings,mcp__secure-mcp-server__list_scope_labels,mcp__secure-mcp-server__list_scope_label_values,mcp__secure-mcp-server__get_customer_settings,mcp__secure-mcp-server__list_runtime_scan_results,mcp__secure-mcp-server__run_sysql"
            --disallowedTools "mcp__secure-mcp-server__create_team,mcp__secure-mcp-server__update_team,mcp__secure-mcp-server__delete_team,mcp__secure-mcp-server__save_team_membership,mcp__secure-mcp-server__create_user,mcp__secure-mcp-server__update_user,mcp__secure-mcp-server__delete_user,mcp__secure-mcp-server__close_job,mcp__secure-mcp-server__create_artifact,mcp__secure-mcp-server__save_plan_report,mcp__secure-mcp-server__save_skill_state,mcp__secure-mcp-server__delete_skill_state,mcp__secure-mcp-server__set_zone_posture_policies,mcp__secure-mcp-server__create_vulnerability_policy,mcp__secure-mcp-server__update_vulnerability_policy,mcp__secure-mcp-server__delete_vulnerability_policy,mcp__secure-mcp-server__update_runtime_policy,mcp__secure-mcp-server__submit_response_action,mcp__secure-mcp-server__undo_response_action"

      # TEMPORARY bisect: which part of the skills mode triggers "credit balance is too low"?
      - name: Bisect N (action, nothing extra)
        id: vn
        if: ${{ inputs.use-skills }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: "Reply with one word."
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 1
      - name: Bisect P (action, plugin only)
        id: vp
        if: ${{ inputs.use-skills }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          plugin_marketplaces: "https://github.com/sysdig/skills.git"
          plugins: "headless-cloud-security@sysdig-skills"
          prompt: "Reply with one word."
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 1
      - name: Bisect M (action, hosted MCP only)
        id: vm
        if: ${{ inputs.use-skills }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: "Reply with one word."
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 1
            --mcp-config .ci/sysdig-mcp-hosted.json
      - name: Bisect result
        if: ${{ always() && inputs.use-skills }}
        run: |
          echo "BISECT N (nothing extra): ${{ steps.vn.outcome }}"
          echo "BISECT P (plugin only):   ${{ steps.vp.outcome }}"
          echo "BISECT M (hosted MCP):    ${{ steps.vm.outcome }}"

      # TEMPORARY diagnosis: run the Claude Code CLI directly with the same key (the action installs it).
      - name: Diagnose Claude Code CLI (temporary)
        if: ${{ always() && inputs.use-skills }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v claude || { echo "claude CLI not found"; exit 0; }
          claude --version
          for m in claude-sonnet-5-5 claude-haiku-4-5-20251001; do
            echo "--- model $m"
            claude -p "Reply with one word." --model "$m" --max-turns 1 --output-format json 2>&1 \
              | sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-***/g' | jq -c '{is_error, result, total_cost_usd, apiKeySource: .apiKeySource}' 2>/dev/null || true
          done
          echo "--- debug api (filtered, masked)"
          claude -p "Reply with one word." --model claude-sonnet-5-5 --max-turns 1 --debug api 2>&1 \
            | sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-***/g' | grep -iE 'credit|error|status|organization|beta|retry|HTTP' | cut -c1-260 | head -30 || true

      - name: Publish report
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -s report.md ] || { echo "::error::report.md was not created"; exit 1; }
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            .ci/reports/post-to-slack.sh report.md
          else
            echo "No SLACK_WEBHOOK_URL secret: skipped the Slack post"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ inputs.biz }}
          path: |
            report.md
            github-data.json
            ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
