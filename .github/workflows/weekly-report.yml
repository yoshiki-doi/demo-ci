# Weekly business report (headless): Claude Code reads Sysdig through MCP and writes one Markdown report.
# Called from each demo-biz-* repository, so every business runs with its own secrets
# (a Sysdig team service account key that only sees that business's zones).
name: weekly-report

on:
  workflow_call:
    inputs:
      biz:
        description: Business key (a, b or c)
        type: string
        required: true
      sysdig-url:
        type: string
        default: https://app.au1.sysdig.com   # AU1 region
      use-skills:
        description: Use the Sysdig Headless Cloud Security skills (sysdig/skills) through the hosted Sysdig MCP server
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      SYSDIG_SECURE_API_TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The caller must grant at least these permissions.
    permissions:
      contents: read
      actions: read
      security-events: read
    env:
      SYSDIG_SECURE_URL: ${{ inputs.sysdig-url }}
      SYSDIG_SECURE_API_TOKEN: ${{ secrets.SYSDIG_SECURE_API_TOKEN }}
    steps:
      # The called workflow's own repository is not checked out automatically; fetch the prompt and MCP config.
      - uses: actions/checkout@v4
        with:
          repository: yoshiki-doi/demo-ci
          ref: main
          path: .ci

      # CI and code scanning of this repository are collected here and handed to Claude as a file,
      # so Claude does not need shell access.
      - name: Collect GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_run=$(gh run list -R "$REPO" --workflow ci --limit 1 --json status,conclusion,createdAt,headSha | jq -c '.[0] // {}')
          if cs_lines=$(gh api "repos/$REPO/code-scanning/alerts?state=open&per_page=100" --paginate \
                -q '.[] | (.rule.security_severity_level // .rule.severity)' 2>/dev/null); then
            cs=$(printf '%s' "$cs_lines" | jq -R -s 'split("\n") | map(select(length>0)) | group_by(.) | map({(.[0]): length}) | add // {}')
          else
            cs='"unavailable (code scanning is not enabled for this repository)"'
          fi
          jq -n --arg repo "$REPO" --argjson run "$latest_run" --argjson cs "$cs" \
            '{repository: $repo, latest_ci_run: $run, code_scanning_open_by_severity: $cs}' > github-data.json
          cat github-data.json

      - name: Render prompt
        id: prompt
        env:
          BIZ: ${{ inputs.biz }}
          REPO: ${{ github.repository }}
          PROMPT_FILE: ${{ inputs.use-skills && 'weekly-report-skills.prompt.md' || 'weekly-report.prompt.md' }}
        run: |
          set -euo pipefail
          upper=$(printf '%s' "$BIZ" | tr '[:lower:]' '[:upper:]')
          {
            echo "prompt<<PROMPT_EOF"
            sed -e "s/{BIZ大文字}/$upper/g" -e "s/{BIZ}/$BIZ/g" -e "s#yoshiki-doi/demo-biz-$BIZ#$REPO#g" ".ci/reports/$PROMPT_FILE"
            cat <<'ADDENDUM'

          ## 実行環境の指定（GitHub Actions）

          - `gh` コマンドは使えない。CI の結果と Code scanning の件数は、ワークスペースの `github-data.json` を読む。
          - 完成したレポートは、ワークスペースの `report.md` に Write ツールで保存する（標準出力には出さない）。
          ADDENDUM
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # Fail fast with a readable reason instead of a generic "Invalid API key" from the action.
      # Prints only the length, the "sk-ant-" style prefix, whether whitespace sneaked in, and the HTTP status.
      - name: Check ANTHROPIC_API_KEY
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::ANTHROPIC_API_KEY is empty or not set"; exit 1; fi
          ws=no; case "$KEY" in *[[:space:]]*) ws=yes ;; esac
          echo "length=${#KEY} prefix=${KEY:0:7} whitespace_inside=$ws"
          code=$(curl -s -o /tmp/anthropic-check.json -w '%{http_code}' https://api.anthropic.com/v1/models \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01")
          echo "Anthropic API status: $code"
          if [ "$code" != "200" ]; then
            # The error body holds only the error type and message (no secrets).
            echo "Anthropic API error: $(jq -r '.error | "\(.type): \(.message)"' /tmp/anthropic-check.json 2>/dev/null | cut -c1-300)"
            echo "::error::ANTHROPIC_API_KEY was rejected (HTTP $code)"; exit 1
          fi

      - name: Generate report with Claude Code
        if: ${{ !inputs.use-skills }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --mcp-config .ci/sysdig-mcp.json
            --allowedTools "mcp__secure-mcp-server__list_zones,mcp__secure-mcp-server__list_runtime_scan_results,mcp__secure-mcp-server__count_runtime_events,mcp__secure-mcp-server__discover_runtime_event_field_values,Read,Write"

      # Skills mode: the hosted Sysdig MCP server accepts the team service account key as a Bearer token,
      # so no OAuth login is needed. Everything except the read tools is blocked.
      - name: Generate report with Claude Code (Sysdig skills)
        if: ${{ inputs.use-skills }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          plugin_marketplaces: "https://github.com/sysdig/skills.git"
          plugins: "headless-cloud-security@sysdig-skills"
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --mcp-config .ci/sysdig-mcp-hosted.json
            --allowedTools "mcp__secure-mcp-server,Skill,Read,Write,Glob"
            --disallowedTools "mcp__secure-mcp-server__create_team,mcp__secure-mcp-server__update_team,mcp__secure-mcp-server__delete_team,mcp__secure-mcp-server__save_team_membership,mcp__secure-mcp-server__create_user,mcp__secure-mcp-server__update_user,mcp__secure-mcp-server__delete_user,mcp__secure-mcp-server__close_job,mcp__secure-mcp-server__create_artifact,mcp__secure-mcp-server__save_plan_report,mcp__secure-mcp-server__save_skill_state,mcp__secure-mcp-server__delete_skill_state,mcp__secure-mcp-server__set_zone_posture_policies,mcp__secure-mcp-server__create_vulnerability_policy,mcp__secure-mcp-server__update_vulnerability_policy,mcp__secure-mcp-server__delete_vulnerability_policy,mcp__secure-mcp-server__update_runtime_policy,mcp__secure-mcp-server__submit_response_action,mcp__secure-mcp-server__undo_response_action"

      - name: Publish report
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -s report.md ] || { echo "::error::report.md was not created"; exit 1; }
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            .ci/reports/post-to-slack.sh report.md
          else
            echo "No SLACK_WEBHOOK_URL secret: skipped the Slack post"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ inputs.biz }}
          path: |
            report.md
            github-data.json
            ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
