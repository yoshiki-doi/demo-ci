# Reusable CI for the demo-biz-* repositories: build, scan with sysdig-cli-scanner, push to ghcr.io.
# Called from each repo's ci.yml; the caller job must grant `packages: write`.
name: build-scan-push

on:
  workflow_call:
    inputs:
      image-name:
        description: Image repository without tag, e.g. ghcr.io/yoshiki-doi/demo-biz-a
        type: string
        required: true
      stop-on-failed-policy-eval:
        description: Fail the job (and skip the push) when the Sysdig policy evaluation fails
        type: boolean
        default: false
      secure-api-url:
        type: string
        default: https://app.au1.sysdig.com   # AU1 region
      upload-sarif:
        description: Upload the SARIF report to GitHub code scanning (needs code scanning enabled on the repo)
        type: boolean
        default: false
      sarif-severity-at-least:
        description: Only report vulnerabilities with at least this severity in the SARIF report (critical, high, medium, low, negligible, any)
        type: string
        default: high
      sarif-group-by-package:
        description: Group vulnerabilities by package in the SARIF report (one alert per package). Default false = one alert per CVE
        type: boolean
        default: false
      sarif-exclude-accepted:
        description: Leave out vulnerabilities whose risk is accepted in Sysdig
        type: boolean
        default: true
    secrets:
      SECURE_API_TOKEN:
        required: true

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # for upload-sarif
    env:
      IMAGE: ${{ inputs.image-name }}:${{ github.sha }}
      IMAGE_LATEST: ${{ inputs.image-name }}:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGE" -t "$IMAGE_LATEST" .
      - name: Scan image
        uses: sysdiglabs/scan-action@v6
        with:
          # Scan the :latest tag (the same image as the sha tag). The SARIF location contains the scanned tag, so
          # a per-commit tag would recreate every code scanning alert on each commit and lose dismissals.
          image-tag: ${{ env.IMAGE_LATEST }}
          sysdig-secure-token: ${{ secrets.SECURE_API_TOKEN }}
          sysdig-secure-url: ${{ inputs.secure-api-url }}
          stop-on-failed-policy-eval: ${{ inputs.stop-on-failed-policy-eval }}
          stop-on-processing-error: true   # operational errors (bad token, network) always fail the job
          # These shape the SARIF report only; the policy evaluation above is unaffected.
          severity-at-least: ${{ inputs.sarif-severity-at-least }}
          group-by-package: ${{ inputs.sarif-group-by-package }}
          exclude-accepted: ${{ inputs.sarif-exclude-accepted }}
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with: {name: sysdig-scan, path: sarif.json, if-no-files-found: ignore}
      - name: Upload SARIF report
        if: (success() || failure()) && inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/sarif.json
      # Push only from main so the cluster (and Sysdig runtime scanner) pulls from the registry.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
